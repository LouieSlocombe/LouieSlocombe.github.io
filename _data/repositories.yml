        tags:
          - VASP
          - HPC
      - repo: LouieSlocombe/ls_hpc_tools
        name: ls_hpc_tools
        kind: Small utility
        language: Python
        summary: A small HPC utility repository whose concrete tool finds and removes Slurm output files recursively,
          with a dry-run option for inspecting the files before cleanup.
        tags:
          - HPC
          - File management
