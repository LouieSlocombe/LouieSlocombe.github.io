github_user: LouieSlocombe
reviewed: November 2026
groups:
  - id: materials
    title: Materials & polymers
    question: From a molecular building block to a material's behaviour.
    description: Tools for building disordered structures, simulating polymers, and connecting electronic structure
      to measurable properties.
    projects:
      - repo: LouieSlocombe/openmmpolymer
        name: openmmpolymer
        kind: Research software
        language: Python
        summary: Turn monomer SMILES into polymer melts and blends. Builds, packs, and equilibrates chains with OpenMM,
          then measures properties such as glass transitions, elasticity, and structure.
        tags:
          - Polymers
          - OpenMM
      - repo: SMTG-Bham/AmorphGen
        name: AmorphGen
        kind: Collaboration
        language: Python
        summary: Build models of materials without a crystal lattice. Generates amorphous structures and ensembles through
          random placement, melt-quench simulations, or a combination of both.
        tags:
          - Amorphous materials
          - Molecular dynamics
        docs: https://smtg-bham.github.io/AmorphGen/
      - repo: LouieSlocombe/py-chargemol
        name: py-chargemol
        kind: Research software
        language: Python
        summary: Turn electron densities into atomic charges, multipoles, and bond orders. Reimplements Chargemol methods
          in Python, including DDEC analysis and QDR charges for point-charge force fields.
        tags:
          - Charge analysis
          - Force fields
      - repo: LouieSlocombe/vanderfast
        name: vanderfast
        kind: Research software
        language: Python / CUDA C++
        summary: Calculate the dispersion interactions that help hold molecules and materials together. Provides GPU
          implementations of D3 and D4 energies, forces, and stress, with ASE interfaces.
        tags:
          - GPU computing
          - Dispersion
      - repo: SMTG-Bham/solphin
        name: solphin
        kind: Collaboration
        language: Python
        summary: Explore a material's potential as a solar absorber. Prepares VASP and CASTEP calculations, then analyses
          optical absorption and theoretical photovoltaic efficiency limits.
        tags:
          - Photovoltaics
          - Electronic structure
        docs: https://solphin.readthedocs.io/en/latest/
  - id: quantum
    title: Reactions & quantum dynamics
    question: Follow a reaction and find out when the nuclei need quantum mechanics.
    description: A connected set of tools for reaction pathways, multiscale simulation, tunnelling, and isotope effects.
    projects:
      - repo: LouieSlocombe/HEOM.jl
        name: HEOM.jl
        kind: Research software
        language: Julia
        summary: Watch quantum probability evolve in phase space. Solves Wigner–Moyal dynamics, hierarchical equations
          of motion, and Caldeira–Leggett models to explore tunnelling, dissipation, and coupling to an environment.
        tags:
          - Open quantum systems
          - Quantum dynamics
      - repo: LouieSlocombe/reactiontools
        name: reactiontools
        kind: Research software
        language: Python
        summary: Follow the route from reactants to products. Connects ASE reaction paths, transition-state searches,
          and PLUMED enhanced sampling with reusable geometry, analysis, and plotting tools.
        tags:
          - Reaction pathways
          - ASE
        docs: https://reactiontools.readthedocs.io/en/latest/
      - repo: LouieSlocombe/openmmnqe
        name: openmmnqe
        kind: Research software
        language: Python
        summary: Explore how quantum nuclei change molecular motion. Runs OpenMM simulations with ring-polymer dynamics
          and adaptive quantum thermal baths, with workflows for transmission coefficients and reaction rates.
        tags:
          - Nuclear quantum effects
          - OpenMM
        docs: https://openmmnqe.readthedocs.io/en/latest/
      - repo: LouieSlocombe/openmmqmmm
        name: openmmqmmm
        kind: Research software
        language: Python
        summary: Treat a reactive region quantum mechanically while retaining its molecular surroundings. Couples ORCA
          and OpenMM for QM/MM simulations, with optional machine-learning potentials; derived from the ASH modelling
          program.
        tags:
          - QM/MM
          - Machine learning
        docs: https://openmmqmmm.readthedocs.io/en/latest/
      - repo: LouieSlocombe/autopcet
        name: autopcet
        kind: Research software
        language: Python
        summary: Calculate rates for reactions in which protons and electrons move together. Solves proton vibrational
          states and nonadiabatic PCET rate models, including kinetic isotope effects and electrochemical interface
          models.
        tags:
          - Proton-coupled electron transfer
          - Rate theory
      - repo: LouieSlocombe/forcefill
        name: forcefill
        kind: Research software
        language: Python
        summary: Fill missing ligand parameters before a simulation starts. Identifies unmatched residues and produces
          validated OpenMM force-field XML using GAFF, OpenFF, Espaloma, or supplied CGenFF parameters.
        tags:
          - Force fields
          - Simulation preparation
        docs: https://forcefill.readthedocs.io/en/latest/
      - repo: LouieSlocombe/nqetools
        name: nqetools
        kind: Research software
        language: Python
        summary: Set up nuclear quantum-effect calculations around i-PI and analyse their results. Includes instanton
          workflows, tunnelling corrections, and plots of reaction rates and kinetic isotope effects.
        tags:
          - i-PI
          - Tunnelling
  - id: assembly
    title: Assembly theory & biochemistry
    question: How much construction history is hidden inside a molecule?
    description: Collaborative tools from the Emergence of Life group at Arizona State University for molecular complexity,
      assembly pathways, and biochemical reaction networks.
    projects:
      - repo: ELIFE-ASU/assemblytheorytools
        name: AssemblyTheoryTools
        kind: Collaboration
        language: Python
        summary: Explore the steps needed to construct molecules, strings, and graphs from reusable parts. Brings assembly
          calculators, shared-structure comparisons, and pathway visualisation together in one Python interface.
        tags:
          - Assembly theory
          - Molecular complexity
        docs: https://assemblytheorytools.readthedocs.io/en/latest/
      - repo: ELIFE-ASU/CBRdb
        name: CBR-db
        kind: Collaboration
        language: Python / Data
        summary: Start biochemical network analysis with cleaner chemistry. Curates KEGG and ATLAS compounds and reactions,
          corrects problematic representations, and adds chemical and thermodynamic properties for further analysis.
        tags:
          - Biochemical reactions
          - Curated data
      - repo: ELIFE-ASU/parallelassemblycpp
        name: ParallelAssemblyCpp
        kind: Collaboration
        language: C++
        summary: Search for minimal assembly pathways for molecules and strings using parallel C++. Supports exact searches
          and fast RePair upper bounds; interrupted searches report the best result found so far.
        tags:
          - Assembly algorithms
          - Parallel computing
      - repo: ELIFE-ASU/assemblycfg
        name: assemblycfg
        kind: Collaboration
        language: Python
        summary: Estimate assembly complexity using reusable patterns. Computes upper and lower bounds for strings and
          molecules, with RePair construction pathways that reveal how repeated fragments can be reused.
        tags:
          - Assembly bounds
          - Graphs & grammars
  - id: proteins-data
    title: Proteins & scientific data
    question: Turn sequences, papers, and figures into something you can work with.
    description: Protein-folding helpers and tools for recovering structured information from the scientific literature.
    projects:
      - repo: SMTG-Bham/PaperMinerToolkit
        name: PaperMinerToolkit
        kind: Collaboration
        language: Python
        summary: Build a literature corpus and turn papers into structured datasets. Searches research sources, collects
          text and PDFs, and applies configurable text and vision models to extract recipe-defined information.
        tags:
          - Literature mining
          - Machine learning
      - repo: SMTG-Bham/figrecover
        name: figrecover
        kind: Collaboration
        language: Python
        summary: Recover numerical data from published plots. Traces curves in images and reads vector paths in PDF
          and SVG figures, exporting points as CSV in the original plot's units.
        tags:
          - Figure digitisation
          - Data extraction
      - repo: LouieSlocombe/esmfoldtools
        name: esmfoldtools
        kind: Research software
        language: Python
        summary: Predict a protein structure from its sequence with ESMFold, return confidence information, and repair
          PDB structures with PDBFixer to prepare them for molecular simulation.
        tags:
          - Protein folding
          - Structure preparation
      - repo: LouieSlocombe/esmfold-gaudi2-examples
        name: ESMFold on Gaudi2
        kind: Examples
        language: Python
        summary: Run the same protein-folding task on different accelerators. Provides ESMFold examples for conventional
          GPUs and Intel Gaudi2 HPUs, starting from an input amino-acid sequence.
        tags:
          - Protein folding
          - Accelerators
  - id: paper-code
    title: Code behind the papers
    question: Explore the calculations behind the scientific story.
    description: Study-specific scripts, structures, and datasets for research on DNA, ion channels, and surface chemistry.
      Each repository preserves the scope and workflow of its accompanying study.
    projects:
      - repo: LouieSlocombe/Watson-Crick-tautomerism-in-AT-and-GC-base-pairs
        name: Watson–Crick tautomerism
        kind: Paper companion
        language: Structure data
        summary: Examine the molecular structures behind a study of quantum and classical effects in DNA point mutations.
          Provides the AT and GC base-pair structures associated with the paper.
        tags:
          - DNA
          - Molecular structures
        paper: https://doi.org/10.1039/D0CP05781A
      - repo: LouieSlocombe/Effect-of-Helicase-Separation-on-GC-Tautomerism
        name: GC tautomerism during strand separation
        kind: Paper companion
        language: Python / Data
        summary: Follow proton transfer as guanine–cytosine base pairs are pulled apart. Contains GROMACS inputs, molecular
          structures, reaction paths, and analysis for DNA strand-separation calculations.
        tags:
          - DNA
          - Strand separation
      - repo: LouieSlocombe/Effect-of-Strand-Separation-on-AT-Tautomerism
        name: AT tautomerism during strand separation
        kind: Paper companion
        language: Python / Data
        summary: Explore adenine–thymine base pairs under strand separation using molecular-dynamics inputs, machine-learning-assisted
          reaction paths, and Python analysis scripts, with accompanying structures and figures.
        tags:
          - DNA
          - Reaction pathways
      - repo: LouieSlocombe/MethylatedProtonTransfer
        name: Proton transfer in methylated DNA
        kind: Paper companion
        language: Python / Julia / Data
        summary: Investigate how methylation and strand separation affect proton transfer in DNA. Includes reaction
          paths, reaction-network code, hydrogen-bond analysis, and scripts for preparing and separating base pairs.
        tags:
          - DNA
          - Proton transfer
      - repo: LouieSlocombe/ASIC1_Selectivity_Q_vs_C
        name: Ion selectivity in ASIC1
        kind: Paper companion
        language: Python / Julia / Data
        summary: Compare classical and quantum descriptions of an ion-channel selectivity filter. Contains potential-energy
          scans, quantum-dynamics scripts, and analysis for the study of ion selectivity in ASIC1.
        tags:
          - Ion channels
          - Quantum biology
      - repo: LouieSlocombe/H-Tunnelling-Graphene
        name: Hydrogen tunnelling on graphene
        kind: Research companion
        language: Python / Data
        summary: Study hydrogen motion on a carbon surface. Collects data and example ASE/CASTEP reaction-path calculations
          for the hydrogen-tunnelling-on-graphene project.
        tags:
          - Surface chemistry
          - Tunnelling
  - id: utilities
