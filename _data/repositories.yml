# Reviewed against public GitHub READMEs and source on 2026-11-15.
# Curated portfolio: include original work and substantial collaborations only.
# Within each group, project order is a rough editorial ranking: higher research
# impact and more substantial personal contributions first. Preserve this order.
# Weigh scientific significance, original development, reuse, and maturity; avoid
# automatic alphabetical, recency, star-count, or commit-count sorting.
# Do not add forks (personal or group), copied upstream utilities, or projects
# where Louie's involvement is limited to small fixes, packaging, or publishing.
# A GitHub contribution or ownership record alone is not grounds for inclusion.
# Do not restore excluded entries during future GitHub catalogue refreshes.
