github_user: LouieSlocombe
reviewed: November 2026
groups:
  - id: materials
    title: Materials & polymers
    question: From monomers to the properties of a material.
    description: Building polymers and amorphous structures is often the first step in a simulation. These tools
      handle that preparation and help connect the resulting structures to measurable properties.
    projects:
      - repo: LouieSlocombe/openmmpolymer
        name: openmmpolymer
        kind: Research software
        language: Python
        summary: "Starting from monomer SMILES, openmmpolymer builds, packs, and equilibrates polymer melts and blends with OpenMM. It then
          measures properties such as glass transitions, elasticity, and structure."
        tags:
          - Polymers
          - OpenMM
      - repo: SMTG-Bham/AmorphGen
        name: AmorphGen
        kind: Collaboration
        language: Python
        summary: "For materials without a crystal lattice, AmorphGen builds amorphous structures through random placement, melt-quench
          simulations, or a combination of the two. It can generate ensembles as well as individual structures."
        tags:
          - Amorphous materials
          - Molecular dynamics
        docs: https://smtg-bham.github.io/AmorphGen/
      - repo: LouieSlocombe/py-chargemol
        name: py-chargemol
        kind: Research software
        language: Python
        summary: "A Python implementation of Chargemol methods for turning electron densities into atomic charges, multipoles, and bond
          orders. It includes DDEC analysis and QDR charges for point-charge force fields."
        tags:
          - Charge analysis
          - Force fields
      - repo: LouieSlocombe/vanderfast
        name: vanderfast
        kind: Research software
        language: Python / CUDA C++
        summary: "GPU implementations of the D3 and D4 dispersion models, calculating the energies, forces, and stress associated with
          these interactions. ASE interfaces connect the calculations to molecular and materials workflows."
        tags:
          - GPU computing
          - Dispersion
      - repo: SMTG-Bham/solphin
        name: solphin
        kind: Collaboration
        language: Python
        summary: "Tools for investigating whether a material could work as a solar absorber. solphin prepares VASP and CASTEP calculations,
          then analyses optical absorption and the theoretical limits of photovoltaic efficiency."
        tags:
          - Photovoltaics
          - Electronic structure
        docs: https://solphin.readthedocs.io/en/latest/
  - id: quantum
    title: Reactions & quantum dynamics
    question: Following reactions with quantum nuclei.
    description: Much of my work asks how nuclei move during a reaction. These packages cover reaction paths,
      multiscale simulations, tunnelling, and isotope effects, along with the setup and analysis those calculations need.
    projects:
      - repo: LouieSlocombe/HEOM.jl
        name: HEOM.jl
        kind: Research software
        language: Julia
        summary: "A Julia package for following quantum probability through phase space. It solves Wigner–Moyal dynamics, hierarchical
          equations of motion, and Caldeira–Leggett models to study tunnelling, dissipation, and coupling to an
          environment."
        tags:
          - Open quantum systems
          - Quantum dynamics
      - repo: LouieSlocombe/reactiontools
        name: reactiontools
        kind: Research software
        language: Python
        summary: "The steps around a reaction-path calculation, brought together in Python: ASE paths and transition-state searches, PLUMED
          enhanced sampling, and reusable geometry, analysis, and plotting tools."
        tags:
          - Reaction pathways
          - ASE
        docs: https://reactiontools.readthedocs.io/en/latest/
      - repo: LouieSlocombe/openmmnqe
        name: openmmnqe
        kind: Research software
        language: Python
        summary: "Simulations of quantum nuclei in OpenMM, using ring-polymer dynamics and adaptive quantum thermal baths. Includes
          workflows for calculating transmission coefficients and reaction rates."
        tags:
          - Nuclear quantum effects
          - OpenMM
        docs: https://openmmnqe.readthedocs.io/en/latest/
      - repo: LouieSlocombe/openmmqmmm
        name: openmmqmmm
        kind: Research software
        language: Python
        summary: "A way to place a quantum-mechanical description of a reactive region inside a larger molecular simulation. It couples
          ORCA and OpenMM, with optional machine-learning potentials, and is derived from the ASH modelling program."
        tags:
          - QM/MM
          - Machine learning
        docs: https://openmmqmmm.readthedocs.io/en/latest/
      - repo: LouieSlocombe/autopcet
        name: autopcet
        kind: Research software
        language: Python
        summary: "For reactions in which protons and electrons transfer together. It solves for proton vibrational states and evaluates
          nonadiabatic PCET rate models, including kinetic isotope effects and models of electrochemical interfaces."
        tags:
          - Proton-coupled electron transfer
          - Rate theory
      - repo: LouieSlocombe/forcefill
        name: forcefill
        kind: Research software
        language: Python
        summary: "Helps prepare a simulation when ligand parameters are missing. It identifies unmatched residues and produces validated
          OpenMM force-field XML using GAFF, OpenFF, Espaloma, or supplied CGenFF parameters."
        tags:
          - Force fields
          - Simulation preparation
        docs: https://forcefill.readthedocs.io/en/latest/
      - repo: LouieSlocombe/nqetools
        name: nqetools
        kind: Research software
        language: Python
        summary: "Setup and analysis tools for nuclear quantum-effect calculations with i-PI. These include instanton workflows, tunnelling
          corrections, and plots of reaction rates and kinetic isotope effects."
        tags:
          - i-PI
          - Tunnelling
  - id: assembly
    title: Assembly theory & biochemistry
    question: How much construction history is hidden inside a molecule?
    description: Work with the Emergence of Life group at Arizona State University on molecular complexity,
      assembly pathways, and biochemical reaction networks. The software brings the calculations and the chemistry together.
    projects:
      - repo: ELIFE-ASU/assemblytheorytools
        name: AssemblyTheoryTools
        kind: Collaboration
        language: Python
        summary: "A common Python interface for exploring how molecules, strings, and graphs can be built from reusable parts. It brings
          together assembly calculators, comparisons of shared structure, and pathway visualisation."
        tags:
          - Assembly theory
          - Molecular complexity
        docs: https://assemblytheorytools.readthedocs.io/en/latest/
      - repo: ELIFE-ASU/CBRdb
        name: CBR-db
        kind: Collaboration
        language: Python / Data
        summary: "A biochemical reaction database for studying the chemistry behind metabolic networks. It curates KEGG and ATLAS compounds
          and reactions, repairs problematic representations, and adds chemical and thermodynamic properties for
          analysis."
        tags:
          - Biochemical reactions
          - Curated data
      - repo: ELIFE-ASU/parallelassemblycpp
        name: ParallelAssemblyCpp
        kind: Collaboration
        language: C++
        summary: "Parallel C++ searches for minimal assembly pathways in molecules and strings, with exact searches and fast RePair upper
          bounds. If a search is interrupted, it reports the best result found so far."
        tags:
          - Assembly algorithms
          - Parallel computing
      - repo: ELIFE-ASU/assemblycfg
        name: assemblycfg
        kind: Collaboration
        language: Python
        summary: "Estimates upper and lower bounds on assembly complexity for strings and molecules. RePair construction pathways show
          which repeated fragments can be reused along the way."
        tags:
          - Assembly bounds
          - Graphs & grammars
  - id: proteins-data
    title: Proteins & scientific data
    question: Working with sequences and published data.
    description: Sometimes the starting point is an amino-acid sequence; sometimes it's a paper or a plot.
      These tools help turn those sources into structures and datasets for further research.
    projects:
      - repo: SMTG-Bham/PaperMinerToolkit
        name: PaperMinerToolkit
        kind: Collaboration
        language: Python
        summary: "Tools for turning a collection of papers into a structured dataset. It searches research sources, gathers text and PDFs,
          and uses configurable text and vision models to extract the information specified in a recipe."
        tags:
          - Literature mining
          - Machine learning
      - repo: SMTG-Bham/figrecover
        name: figrecover
        kind: Collaboration
        language: Python
        summary: "For the numbers that are available only in a published figure. It traces curves in images or reads vector paths in PDF
          and SVG plots, then exports CSV data in the original units."
        tags:
          - Figure digitisation
          - Data extraction
      - repo: LouieSlocombe/esmfoldtools
        name: esmfoldtools
        kind: Research software
        language: Python
        summary: "Takes an amino-acid sequence through ESMFold to a predicted protein structure with confidence information. It also
          repairs PDB structures with PDBFixer in preparation for molecular simulation."
        tags:
          - Protein folding
          - Structure preparation
      - repo: LouieSlocombe/esmfold-gaudi2-examples
        name: ESMFold on Gaudi2
        kind: Examples
        language: Python
        summary: "Examples of the same ESMFold protein-folding task on conventional GPUs and Intel Gaudi2 HPUs, starting from an amino-acid
          sequence."
        tags:
          - Protein folding
          - Accelerators
  - id: paper-code
    title: Code behind the papers
    question: A closer look at the calculations.
    description: The inputs, structures, and analysis behind individual studies of DNA, ion channels, and surface chemistry.
      Each repository belongs to a particular piece of research, so the accompanying paper gives its context.
    projects:
      - repo: LouieSlocombe/Watson-Crick-tautomerism-in-AT-and-GC-base-pairs
        name: Watson–Crick tautomerism
        kind: Paper companion
        language: Structure data
        summary: "The AT and GC base-pair structures used in our study of quantum and classical effects in DNA point mutations. These are
          the molecular structures behind the paper."
        tags:
          - DNA
          - Molecular structures
        paper: https://doi.org/10.1039/D0CP05781A
      - repo: LouieSlocombe/Effect-of-Helicase-Separation-on-GC-Tautomerism
        name: GC tautomerism during strand separation
        kind: Paper companion
        language: Python / Data
        summary: "GROMACS inputs, molecular structures, reaction paths, and analysis from our calculations of guanine–cytosine strand
          separation. The study follows proton transfer as the base pairs are pulled apart."
        tags:
          - DNA
          - Strand separation
      - repo: LouieSlocombe/Effect-of-Strand-Separation-on-AT-Tautomerism
        name: AT tautomerism during strand separation
        kind: Paper companion
        language: Python / Data
        summary: "Calculations following adenine–thymine base pairs as the strands separate, with molecular-dynamics inputs,
          machine-learning-assisted reaction paths, and Python analysis scripts. Structures and figures are included
          alongside the calculations."
        tags:
          - DNA
          - Reaction pathways
      - repo: LouieSlocombe/MethylatedProtonTransfer
        name: Proton transfer in methylated DNA
        kind: Paper companion
        language: Python / Julia / Data
        summary: "Code from our study of how methylation and strand separation affect proton transfer in DNA. Includes reaction paths,
          reaction-network calculations, hydrogen-bond analysis, and scripts for preparing and separating base pairs."
        tags:
          - DNA
          - Proton transfer
      - repo: LouieSlocombe/ASIC1_Selectivity_Q_vs_C
        name: Ion selectivity in ASIC1
        kind: Paper companion
        language: Python / Julia / Data
        summary: "The potential-energy scans, quantum-dynamics scripts, and analysis behind our comparison of classical and quantum
          explanations for ion selectivity in ASIC1."
        tags:
          - Ion channels
          - Quantum biology
      - repo: LouieSlocombe/H-Tunnelling-Graphene
        name: Hydrogen tunnelling on graphene
        kind: Research companion
        language: Python / Data
        summary: "Data and example ASE/CASTEP reaction-path calculations from the hydrogen-tunnelling-on-graphene project, following
          hydrogen motion on the carbon surface."
        tags:
          - Surface chemistry
          - Tunnelling
