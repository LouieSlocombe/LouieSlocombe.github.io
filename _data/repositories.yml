          - HPC
          - Job submission
      - repo: LouieSlocombe/vasptools
        name: vasptools
        kind: Workflow scripts
        language: Python / Shell
        summary: Manage batches of VASP jobs with a Slurm array script and an output-file scanner that reports normal
