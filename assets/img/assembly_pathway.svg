<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" role="img" aria-label="Two assembly pathways for strings of equal length. The string abcabc is built in three joins because the intermediate abc is reused, while abcdef needs five joins because it contains no repeated substructure.">
  <defs>
    <marker id="apArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8f96a1"/>
    </marker>
    <marker id="apReuse" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#159a8c"/>
    </marker>
  </defs>

  <g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">

    <!-- panel divider -->
    <path d="M 400 46 L 400 344" stroke="#8f96a1" stroke-width="1.4" opacity="0.5" fill="none"/>

    <!-- panel titles -->
    <text x="215" y="30" fill="#6f7681" font-size="20" text-anchor="middle">
      <tspan font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-weight="600">abcabc</tspan>
      <tspan> — assembly index 3</tspan>
    </text>
    <text x="585" y="30" fill="#6f7681" font-size="20" text-anchor="middle">
      <tspan font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-weight="600">abcdef</tspan>
      <tspan> — assembly index 5</tspan>
    </text>

    <!-- ================= panel A edges ================= -->
    <g stroke="#8f96a1" stroke-width="2" fill="none" marker-end="url(#apArrow)">
      <path d="M 142 298 L 160 264"/>
      <path d="M 198 298 L 180 264"/>
      <path d="M 176 226 L 204 192"/>
      <path d="M 256 298 L 228 192"/>
    </g>
    <!-- reuse of abc -->
    <g stroke="#159a8c" stroke-width="2.4" fill="none" marker-end="url(#apReuse)">
      <path d="M 203 154 C 172 132, 168 116, 182 100"/>
      <path d="M 227 154 C 258 132, 262 116, 248 100"/>
    </g>
    <text x="298" y="128" fill="#159a8c" font-size="17" text-anchor="start">reused</text>

    <!-- ================= panel A nodes ================= -->
    <g>
      <!-- units -->
      <g fill="#8f96a1" fill-opacity="0.18" stroke="#8f96a1" stroke-width="1.8">
        <rect x="123" y="300" width="34" height="32" rx="7"/>
        <rect x="183" y="300" width="34" height="32" rx="7"/>
        <rect x="243" y="300" width="34" height="32" rx="7"/>
      </g>
      <g fill="#6f7681" font-size="19" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
        <text x="140" y="322">a</text>
        <text x="200" y="322">b</text>
        <text x="260" y="322">c</text>
      </g>
      <!-- virtual objects -->
      <g fill="none" stroke="#3d7fc1" stroke-width="2">
        <rect x="144" y="228" width="52" height="32" rx="7"/>
        <rect x="182" y="156" width="66" height="32" rx="7"/>
      </g>
      <g fill="#3d7fc1" font-size="19" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
        <text x="170" y="250">ab</text>
        <text x="215" y="178">abc</text>
      </g>
      <!-- observed object -->
      <rect x="159" y="64" width="112" height="32" rx="7" fill="none" stroke="#d98324" stroke-width="3"/>
      <text x="215" y="86" fill="#d98324" font-size="19" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">abcabc</text>
    </g>
    <!-- step badges -->
    <g>
      <circle cx="136" cy="222" r="11" fill="#3d7fc1"/>
      <circle cx="174" cy="150" r="11" fill="#3d7fc1"/>
      <circle cx="151" cy="58" r="11" fill="#d98324"/>
      <g fill="#ffffff" font-size="14" text-anchor="middle" font-weight="600">
        <text x="136" y="227">1</text>
        <text x="174" y="155">2</text>
        <text x="151" y="63">3</text>
      </g>
    </g>

    <!-- ================= panel B edges ================= -->
    <g stroke="#8f96a1" stroke-width="2" fill="none" marker-end="url(#apArrow)">
      <path d="M 467 298 L 478 264"/>
      <path d="M 505 298 L 494 264"/>
      <path d="M 551 298 L 562 264"/>
      <path d="M 589 298 L 578 264"/>
      <path d="M 635 298 L 646 264"/>
      <path d="M 673 298 L 662 264"/>
      <path d="M 488 226 L 516 192"/>
      <path d="M 568 226 L 540 192"/>
      <path d="M 532 154 L 556 100"/>
      <path d="M 650 226 L 590 100"/>
    </g>

    <!-- ================= panel B nodes ================= -->
    <g>
      <!-- units -->
      <g fill="#8f96a1" fill-opacity="0.18" stroke="#8f96a1" stroke-width="1.8">
        <rect x="448" y="300" width="34" height="32" rx="7"/>
        <rect x="490" y="300" width="34" height="32" rx="7"/>
        <rect x="532" y="300" width="34" height="32" rx="7"/>
        <rect x="574" y="300" width="34" height="32" rx="7"/>
        <rect x="616" y="300" width="34" height="32" rx="7"/>
        <rect x="658" y="300" width="34" height="32" rx="7"/>
      </g>
      <g fill="#6f7681" font-size="19" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
        <text x="465" y="322">a</text>
        <text x="507" y="322">b</text>
        <text x="549" y="322">c</text>
        <text x="591" y="322">d</text>
        <text x="633" y="322">e</text>
        <text x="675" y="322">f</text>
      </g>
      <!-- virtual objects -->
      <g fill="none" stroke="#3d7fc1" stroke-width="2">
        <rect x="460" y="228" width="52" height="32" rx="7"/>
        <rect x="544" y="228" width="52" height="32" rx="7"/>
        <rect x="628" y="228" width="52" height="32" rx="7"/>
        <rect x="487" y="156" width="82" height="32" rx="7"/>
      </g>
      <g fill="#3d7fc1" font-size="19" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
        <text x="486" y="250">ab</text>
        <text x="570" y="250">cd</text>
        <text x="654" y="250">ef</text>
        <text x="528" y="178">abcd</text>
      </g>
      <!-- observed object -->
      <rect x="514" y="64" width="112" height="32" rx="7" fill="none" stroke="#d98324" stroke-width="3"/>
      <text x="570" y="86" fill="#d98324" font-size="19" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">abcdef</text>
    </g>
    <!-- step badges -->
    <g>
      <circle cx="452" cy="222" r="11" fill="#3d7fc1"/>
      <circle cx="536" cy="222" r="11" fill="#3d7fc1"/>
      <circle cx="620" cy="222" r="11" fill="#3d7fc1"/>
      <circle cx="479" cy="150" r="11" fill="#3d7fc1"/>
      <circle cx="506" cy="58" r="11" fill="#d98324"/>
      <g fill="#ffffff" font-size="14" text-anchor="middle" font-weight="600">
        <text x="452" y="227">1</text>
        <text x="536" y="227">2</text>
        <text x="620" y="227">3</text>
        <text x="479" y="155">4</text>
        <text x="506" y="63">5</text>
      </g>
    </g>

    <!-- legend -->
    <g>
      <rect x="150" y="366" width="26" height="18" rx="5" fill="#8f96a1" fill-opacity="0.18" stroke="#8f96a1" stroke-width="1.6"/>
      <text x="184" y="381" fill="#6f7681" font-size="17" text-anchor="start">unit</text>
      <rect x="256" y="366" width="26" height="18" rx="5" fill="none" stroke="#3d7fc1" stroke-width="2"/>
      <text x="290" y="381" fill="#6f7681" font-size="17" text-anchor="start">virtual object</text>
      <rect x="424" y="366" width="26" height="18" rx="5" fill="none" stroke="#d98324" stroke-width="2.6"/>
      <text x="458" y="381" fill="#6f7681" font-size="17" text-anchor="start">observed object</text>
    </g>
  </g>
</svg>
