<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" width="800" height="380" role="img" aria-label="Three independent routes to the same assembly index: a graph search over the molecular graph, a count of peaks in the fingerprint region of an infrared spectrum, and a recursive walk over a tandem mass spectrometry fragment tree.">
  <defs>
    <marker id="amArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6f7681"/>
    </marker>
    <marker id="amSmall" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8f96a1"/>
    </marker>
  </defs>

  <g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">

    <!-- panel backgrounds -->
    <g fill="#8f96a1" opacity="0.09">
      <rect x="48" y="22" width="254" height="108" rx="10"/>
      <rect x="48" y="136" width="254" height="108" rx="10"/>
      <rect x="48" y="250" width="254" height="108" rx="10"/>
    </g>

    <!-- panel titles -->
    <g fill="#6f7681" font-size="18" text-anchor="middle">
      <text x="175" y="48">molecular graph</text>
      <text x="175" y="162">infrared spectrum</text>
      <text x="175" y="276">MS/MS fragment tree</text>
    </g>

    <!-- ============ panel 1: molecular graph ============ -->
    <g stroke="#8f96a1" stroke-width="2.2" fill="none">
      <path d="M 150 66 L 129 78 L 129 102 L 150 114 L 171 102 L 171 78 Z"/>
      <path d="M 171 78 L 200 68"/>
      <path d="M 171 102 L 200 112"/>
    </g>
    <g fill="#3d7fc1">
      <circle cx="150" cy="66" r="3.6"/>
      <circle cx="129" cy="78" r="3.6"/>
      <circle cx="129" cy="102" r="3.6"/>
      <circle cx="150" cy="114" r="3.6"/>
      <circle cx="171" cy="102" r="3.6"/>
      <circle cx="171" cy="78" r="3.6"/>
    </g>
    <g fill="#6f7681" font-size="17" text-anchor="start">
      <text x="207" y="74">O</text>
      <text x="207" y="118">N</text>
    </g>

    <!-- ============ panel 2: infrared spectrum ============ -->
    <path d="M 70 230 L 288 230" stroke="#8f96a1" stroke-width="1.6" fill="none"/>
    <path d="M 70 230 L 84 230 L 92 200 L 100 230 L 110 230 L 118 184 L 126 230 L 138 230 L 146 208 L 154 230 L 170 230 L 178 178 L 186 230 L 202 230 L 210 196 L 218 230 L 236 230 L 244 190 L 252 230 L 260 230 L 268 212 L 276 230 L 288 230"
          stroke="#8f96a1" stroke-width="2.2" fill="none" stroke-linejoin="round"/>
    <g fill="#159a8c">
      <circle cx="92" cy="200" r="4"/>
      <circle cx="118" cy="184" r="4"/>
      <circle cx="146" cy="208" r="4"/>
      <circle cx="178" cy="178" r="4"/>
      <circle cx="210" cy="196" r="4"/>
      <circle cx="244" cy="190" r="4"/>
      <circle cx="268" cy="212" r="4"/>
    </g>

    <!-- ============ panel 3: MS/MS fragment tree ============ -->
    <g stroke="#8f96a1" stroke-width="1.8" fill="none" marker-end="url(#amSmall)">
      <path d="M 104 314 L 146 294"/>
      <path d="M 104 318 L 146 318"/>
      <path d="M 104 322 L 146 342"/>
      <path d="M 192 314 L 230 306"/>
      <path d="M 192 322 L 230 332"/>
    </g>
    <rect x="58" y="305" width="46" height="26" rx="6" fill="none" stroke="#d98324" stroke-width="2.4"/>
    <g fill="none" stroke="#3d7fc1" stroke-width="1.8">
      <rect x="148" y="284" width="44" height="20" rx="6"/>
      <rect x="148" y="308" width="44" height="20" rx="6"/>
      <rect x="148" y="332" width="44" height="20" rx="6"/>
      <rect x="232" y="296" width="38" height="20" rx="6"/>
      <rect x="232" y="322" width="38" height="20" rx="6"/>
    </g>
    <text x="81" y="350" fill="#d98324" font-size="14" text-anchor="middle">parent</text>

    <!-- ============ arrows to the assembly index ============ -->
    <g stroke="#6f7681" stroke-width="2.5" fill="none" marker-end="url(#amArrow)">
      <path d="M 306 76 C 400 76, 450 110, 552 172"/>
      <path d="M 306 190 L 552 190"/>
      <path d="M 306 304 C 400 304, 450 265, 552 210"/>
    </g>
    <g fill="#6f7681" font-size="17" text-anchor="middle">
      <text x="440" y="60">graph search, NP-hard</text>
      <text x="428" y="176">count fingerprint peaks</text>
      <text x="440" y="326">recursion over the tree</text>
    </g>

    <!-- ============ the measured quantity ============ -->
    <rect x="560" y="142" width="196" height="92" rx="12" fill="#159a8c" fill-opacity="0.10" stroke="#159a8c" stroke-width="3"/>
    <text x="658" y="182" fill="#6f7681" font-size="20" text-anchor="middle">assembly index</text>
    <text x="658" y="220" fill="#159a8c" font-size="32" text-anchor="middle" font-weight="600">MA</text>
  </g>
</svg>
