<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="800" height="420" role="img" aria-label="Asymmetric double-well potential for double proton transfer in the guanine-cytosine base pair, showing the canonical G-C minimum, the higher-lying tautomeric G*-C* minimum, and a tunnelling pathway through the barrier.">
  <defs>
    <marker id="ptArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#159a8c"/>
    </marker>
    <marker id="ptTick" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6f7681"/>
    </marker>
  </defs>

  <g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">

    <!-- axes -->
    <path d="M 62 380 L 62 60" stroke="#6f7681" stroke-width="2" fill="none"/>
    <path d="M 62 380 L 762 380" stroke="#6f7681" stroke-width="2" fill="none"/>
    <text x="30" y="230" fill="#6f7681" font-size="20" text-anchor="middle" transform="rotate(-90 30 230)">energy</text>
    <text x="412" y="410" fill="#6f7681" font-size="20" text-anchor="middle">proton position along the hydrogen bond</text>

    <!-- reference levels -->
    <path d="M 190 331 L 712 331" stroke="#6f7681" stroke-width="1.4" stroke-dasharray="5 6" opacity="0.75" fill="none"/>
    <path d="M 250 122 L 420 122" stroke="#6f7681" stroke-width="1.4" stroke-dasharray="5 6" opacity="0.75" fill="none"/>
    <path d="M 610 245 L 712 245" stroke="#6f7681" stroke-width="1.4" stroke-dasharray="5 6" opacity="0.75" fill="none"/>

    <!-- potential energy surface -->
    <path d="M 70 230 C 120 330 152 332 190 331 C 262 329 332 150 400 122 C 470 150 546 244 610 245 C 656 246 702 214 742 184"
          stroke="#8f96a1" stroke-width="3.5" fill="none" stroke-linecap="round"/>

    <!-- wells -->
    <circle cx="190" cy="331" r="9" fill="#3d7fc1"/>
    <circle cx="610" cy="245" r="9" fill="#d98324"/>

    <!-- forward barrier -->
    <path d="M 286 331 L 286 122" stroke="#6f7681" stroke-width="1.8" fill="none"
          marker-start="url(#ptTick)" marker-end="url(#ptTick)"/>
    <text x="272" y="222" fill="#6f7681" font-size="21" text-anchor="end">E<tspan font-size="15" dy="-8">‡</tspan></text>
    <text x="272" y="248" fill="#6f7681" font-size="19" text-anchor="end">≈ 0.6 eV</text>

    <!-- reaction asymmetry -->
    <path d="M 686 331 L 686 245" stroke="#6f7681" stroke-width="1.8" fill="none"
          marker-start="url(#ptTick)" marker-end="url(#ptTick)"/>
    <text x="702" y="284" fill="#6f7681" font-size="20" text-anchor="start">ΔE</text>
    <text x="702" y="308" fill="#6f7681" font-size="19" text-anchor="start">≈ 0.5 eV</text>

    <!-- tunnelling pathway -->
    <path d="M 322 205 L 492 205" stroke="#159a8c" stroke-width="3" stroke-dasharray="9 7" fill="none"
          marker-end="url(#ptArrow)"/>
    <text x="400" y="182" fill="#159a8c" font-size="21" text-anchor="middle" font-weight="600">tunnelling</text>

    <!-- state labels -->
    <text x="190" y="366" fill="#3d7fc1" font-size="23" text-anchor="middle" font-weight="600">G–C</text>
    <text x="610" y="212" fill="#d98324" font-size="23" text-anchor="middle" font-weight="600">G*–C*</text>
    <text x="610" y="190" fill="#8f96a1" font-size="18" text-anchor="middle">mutagenic tautomer</text>
  </g>
</svg>
