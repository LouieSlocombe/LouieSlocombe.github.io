<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="800" height="420" role="img" aria-label="Comparison of the double proton transfer potential in a closed DNA duplex and during strand separation. As the strands unzip the reaction barrier grows while the tautomer minimum drops closer to the canonical level, stabilising and trapping the tautomer population.">
  <defs>
    <marker id="ssArrowUp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d98324"/>
    </marker>
  </defs>

  <g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">

    <!-- axes -->
    <path d="M 62 372 L 62 40" stroke="#6f7681" stroke-width="2" fill="none"/>
    <path d="M 62 372 L 762 372" stroke="#6f7681" stroke-width="2" fill="none"/>
    <text x="30" y="206" fill="#6f7681" font-size="20" text-anchor="middle" transform="rotate(-90 30 206)">energy</text>
    <text x="412" y="402" fill="#6f7681" font-size="20" text-anchor="middle">proton position along the hydrogen bond</text>

    <!-- shared canonical level -->
    <path d="M 196 318 L 660 318" stroke="#6f7681" stroke-width="1.3" stroke-dasharray="5 6" opacity="0.6" fill="none"/>

    <!-- duplex curve -->
    <path d="M 76 226 C 126 316 160 319 196 318 C 266 317 336 176 400 150 C 466 176 542 247 606 248 C 650 249 700 219 740 192"
          stroke="#3d7fc1" stroke-width="3.4" fill="none" stroke-linecap="round"/>

    <!-- strand-separated curve -->
    <path d="M 76 206 C 126 314 160 319 196 318 C 272 316 340 96 400 66 C 462 96 542 277 606 278 C 652 279 702 246 740 216"
          stroke="#d98324" stroke-width="3.4" stroke-dasharray="11 8" fill="none" stroke-linecap="round"/>

    <!-- minima markers -->
    <circle cx="196" cy="318" r="8" fill="#6f7681"/>
    <circle cx="606" cy="248" r="7.5" fill="#3d7fc1"/>
    <circle cx="606" cy="278" r="7.5" fill="#d98324"/>

    <!-- barrier growth arrow -->
    <path d="M 400 142 L 400 82" stroke="#d98324" stroke-width="2.6" fill="none" marker-end="url(#ssArrowUp)"/>
    <text x="420" y="112" fill="#d98324" font-size="20" text-anchor="start" font-weight="600">barrier grows</text>
    <text x="420" y="136" fill="#d98324" font-size="18" text-anchor="start">as the strands unzip</text>

    <!-- tautomer stabilised callout -->
    <path d="M 622 284 L 668 330" stroke="#d98324" stroke-width="1.4" opacity="0.8" fill="none"/>
    <text x="756" y="346" fill="#d98324" font-size="19" text-anchor="end" font-weight="600">tautomer stabilised</text>
    <text x="756" y="366" fill="#d98324" font-size="18" text-anchor="end">and trapped</text>

    <!-- state labels -->
    <text x="196" y="352" fill="#6f7681" font-size="22" text-anchor="middle" font-weight="600">G–C</text>
    <text x="606" y="224" fill="#6f7681" font-size="22" text-anchor="middle" font-weight="600">G*–C*</text>

    <!-- legend -->
    <g transform="translate(96 42)">
      <path d="M 0 0 L 40 0" stroke="#3d7fc1" stroke-width="3.4" fill="none" stroke-linecap="round"/>
      <text x="52" y="6" fill="#6f7681" font-size="19">closed duplex</text>
      <path d="M 0 30 L 40 30" stroke="#d98324" stroke-width="3.4" stroke-dasharray="11 8" fill="none" stroke-linecap="round"/>
      <text x="52" y="36" fill="#6f7681" font-size="19">strands separating</text>
    </g>
  </g>
</svg>
